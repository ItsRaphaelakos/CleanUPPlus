workflows:
  ios-simulator-check:
    name: CleanUp+ iOS Simulator Build Check
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        XCODE_SCHEME: CleanUpPlusIOS
    scripts:
      - name: Build for iOS Simulator without signing
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          echo "CM_BUILD_DIR=$CM_BUILD_DIR"
          echo "Available Xcode projects:"
          find . -name "*.xcodeproj" -print
          PROJECT_PATH="$(find . -name "CleanUpPlusIOS.xcodeproj" -print | sort | sed -n '1p')"
          if [ -z "$PROJECT_PATH" ]; then
            echo "CleanUpPlusIOS.xcodeproj was not found. Check the Codemagic project path."
            exit 1
          fi
          echo "Using Xcode project: $PROJECT_PATH"
          xcodebuild -list -project "$PROJECT_PATH"
          xcodebuild build \
            -project "$PROJECT_PATH" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app

  ios-development-ipa:
    name: CleanUp+ iOS Development IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      ios_signing:
        distribution_type: development
        bundle_identifier: com.cleanup.plus.ios
      vars:
        BUNDLE_ID: com.cleanup.plus.ios
        XCODE_SCHEME: CleanUpPlusIOS
    scripts:
      - name: Show Xcode version
        script: xcodebuild -version

      - name: Set up code signing settings
        script: xcode-project use-profiles

      - name: Build signed development IPA
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          echo "CM_BUILD_DIR=$CM_BUILD_DIR"
          echo "Available Xcode projects:"
          find . -name "*.xcodeproj" -print
          PROJECT_PATH="$(find . -name "CleanUpPlusIOS.xcodeproj" -print | sort | sed -n '1p')"
          if [ -z "$PROJECT_PATH" ]; then
            echo "CleanUpPlusIOS.xcodeproj was not found. Check the Codemagic project path."
            exit 1
          fi
          echo "Using Xcode project: $PROJECT_PATH"
          xcode-project build-ipa \
            --project "$PROJECT_PATH" \
            --scheme "$XCODE_SCHEME"

      - name: List IPA output
        script: |
          find build/ios/ipa -maxdepth 2 -type f -print || true
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
